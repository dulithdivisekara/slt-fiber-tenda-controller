[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slt-fiber-tenda-controller"
version = "1.2.0"
description = "Autonomous AI Agent Controller, FastMCP Server, and CLI for Tenda HG7 GPON ONT Routers on SLT Fiber"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dulith Divisekara", email = "dulith@divisekara.me" }
]
keywords = [
    "slt-fiber",
    "slt-mobitel",
    "tenda-hg7",
    "tenda",
    "gpon",
    "ont",
    "router-controller",
    "mcp",
    "fastmcp",
    "model-context-protocol",
    "networking",
    "sri-lanka"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Hardware"
]
dependencies = [
    "httpx>=0.28.0",
    "requests>=2.31.0",
    "pydantic>=2.9.0",
    "rich>=13.7.0",
    "mcp>=1.2.0"
]

[project.optional-dependencies]
browser = ["websockets>=12.0"]

[project.scripts]
tenda-ctl = "tenda_controller.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tenda_controller*"]
